<style>
:root{
  --paper:#F5F5F1; --card:#FFFFFF; --ink:#15181A; --ink2:#5E6469; --ink3:#9AA0A5;
  --accent:#22564A; --mint:#E4EFEA; --line:rgba(21,24,26,.085); --line2:#EDEDE7;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
}
img{max-width:100%}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}
*,body{-webkit-tap-highlight-color:transparent}
a,button{outline:none}
.wrap{max-width:620px;margin:0 auto;padding:0 22px}

/* ---------- 头部 ---------- */
.top{padding:52px 0 0}
.who{display:flex;align-items:center;gap:18px}
.face{
  width:88px;height:88px;flex:none;border-radius:50%;
  background:#fff;border:1px solid var(--line);
  object-fit:cover;display:block;
}
.who .txt{min-width:0}
.name{font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.role{margin-top:7px;font-size:12.5px;color:var(--ink3);line-height:1.6}
.role .dot{display:inline-block;width:14px;height:1px;background:var(--ink3);vertical-align:middle;margin:0 7px;position:relative;top:-1px}

.about{margin-top:26px;font-size:15px;line-height:1.85;color:var(--ink2);max-width:30em}
.about b{color:var(--ink);font-weight:500}

/* ---------- 作品 ---------- */
.label{
  margin:42px 0 0;font-size:11.5px;letter-spacing:.16em;
  color:var(--ink3);text-transform:uppercase;
}
.works{margin-top:12px;display:grid;gap:11px}
.w{
  display:flex;align-items:center;gap:15px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:17px 17px 17px 16px;
  transition:transform .18s cubic-bezier(.22,.7,.2,1),border-color .18s,box-shadow .18s;
}
.w:hover{transform:translateY(-2px);border-color:rgba(34,86,74,.24);box-shadow:0 16px 34px -28px rgba(21,24,26,.5)}
.w .logo{width:46px;height:46px;flex:none;border-radius:12px}
.w .txt{flex:1;min-width:0}
.w .tt{font-size:15.5px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.w .tag{
  font-size:9.5px;font-weight:400;letter-spacing:.04em;color:var(--accent);
  background:var(--mint);padding:2px 6px;border-radius:4px;line-height:1.5;
}
.w .ss{margin-top:4px;font-size:12.5px;color:var(--ink3);line-height:1.55}
.w .go{flex:none;color:var(--ink3)}
.w:hover .go{color:var(--accent)}

/* ---------- 平台 ---------- */
.plats{margin-top:12px;border-top:1px solid var(--line2)}
.p{
  display:flex;align-items:center;gap:13px;padding:15px 2px;
  border-bottom:1px solid var(--line2);
  transition:background .16s;
}
.p:hover{background:#EFEFE9}
.p .mk{width:22px;height:22px;flex:none;opacity:.86}
.p .nm{font-size:14.5px;font-weight:500}
.p .hd{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.p .arw{color:var(--ink3);margin-left:10px;display:flex}
.p:hover .arw{color:var(--accent)}

/* ---------- 尾 ---------- */
.end{margin-top:44px;padding:22px 0 46px;border-top:1px solid var(--line2);
  font-size:12px;color:var(--ink3);line-height:1.9}
.end .ln{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
.end a{border-bottom:1px solid var(--line2);padding-bottom:1px}
.end a:hover{color:var(--accent);border-color:var(--accent)}

@media (min-width:640px){
  .top{padding:72px 0 0}
  .who{gap:22px}
  .face{width:100px;height:100px}
  .name{font-size:30px}
  .w{padding:19px 19px 19px 18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
