<style>
:root{
  --paper:#F6F5F2;
  --card:#FFFFFF;
  --ink:#131517;
  --ink2:#5C6165;
  --ink3:#8E9498;
  --line:rgba(19,21,23,.1);
  --line-2:rgba(19,21,23,.16);
  --deep:#17181B;
  --deep-2:#0E0F11;
  --on:rgba(255,255,255,.96);
  --on-2:rgba(255,255,255,.58);
  --accent:#C0521D;
  --accent-2:#E0713A;
  --accent-soft:#F7EBE3;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);

h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(23,24,27,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1)}
.nav{display:flex;align-items:center;gap:12px;height:56px;max-width:1180px;margin:0 auto;padding:0 18px}
.brand{display:flex;align-items:center;gap:9px;color:var(--on);flex:none}
.brand .mk{width:26px;height:26px;border-radius:7px;background:var(--deep-2);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.brand .mk svg{width:14px;height:14px;stroke:var(--on);fill:none;stroke-width:1.6}
.brand b{font-size:14.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.nav-sp{flex:1}
.nav-link{color:var(--on-2);font-size:12.5px;white-space:nowrap}
.nav-link:hover{color:var(--on)}

/* ---------- 首屏 ---------- */
.hero{background:var(--deep);color:var(--on);padding:44px 0 0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;

.hero-inner{position:relative;z-index:2}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--on-2);letter-spacing:.04em}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--accent-2);display:block}
.hero h1{margin-top:14px;font-size:clamp(28px,7.4vw,50px);letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent-2)}
.hero p{margin:14px 0 0;max-width:44em;font-size:14px;line-height:1.8;color:var(--on-2)}

.searchbar{display:flex;align-items:center;gap:10px;margin-top:24px;background:#fff;border-radius:12px;padding:0 14px;height:50px;max-width:620px}
.searchbar svg{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:1.7;flex:none}
.searchbar input{flex:1;min-width:0;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink)}
.searchbar input::placeholder{color:var(--ink3)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden;margin:26px 0 0}
.stats div{background:var(--deep-2);padding:14px 16px}
.stats b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{display:block;margin-top:5px;font-size:11.5px;color:var(--on-2)}

/* ---------- 筛选 ---------- */
.toolbar{background:var(--deep);padding:18px 0 20px;position:relative;z-index:2;border-bottom:1px solid rgba(255,255,255,.08)}

.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.55;margin-left:5px}
.toolbar-line{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--on-2)}

.rows{display:block}
.row{display:grid;grid-template-columns:32px 1fr auto;gap:3px 12px;padding:13px 8px 12px;border-bottom:1px solid var(--line);

.row .bm.b-xiaomi,.row .bm.b-mi{background:#FF6900;color:#fff}

.row .bm.b-other{background:rgba(19,21,23,.08);color:var(--ink3)}

.row .co{grid-column:2;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px}

.tags{display:inline-flex;gap:4px}

.tag.fb{border-color:rgba(19,21,23,.2);color:var(--ink);background:rgba(19,21,23,.04)}

.more{display:flex;justify-content:center;margin:28px 0 0}

/* ---------- 加载 ---------- */
.loading{position:fixed;left:0;right:0;top:56px;z-index:39;background:var(--deep);color:var(--on-2);

.loading .bar{flex:1;height:2px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;max-width:220px}
.loading .bar i{display:block;height:100%;width:0;background:var(--accent-2);transition:width .2s}

/* ---------- 详情 ---------- */

.d-head{margin-top:16px;padding-bottom:20px;border-bottom:1px solid var(--line-2)}
.d-head h1{font-size:clamp(23px,5.6vw,34px);letter-spacing:-.03em}
.d-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.d-meta code{font-family:var(--mono);font-size:11.5px;background:rgba(19,21,23,.05);padding:2px 6px;border-radius:4px}
.d-sum{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.d-sum div{font-size:12px;color:var(--ink3)}
.d-sum b{color:var(--ink);font-weight:500;font-size:13px;margin-left:4px}

.group{padding:26px 0 4px}
.group h2{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.group h2 .tag{font-size:11px}
.group .hint{font-size:12px;color:var(--ink3);margin:6px 0 0}
.roms{margin-top:12px}
.rom{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rom .v{font-family:var(--mono);font-size:13px;letter-spacing:-.01em;word-break:break-all}
.rom .m{font-size:11.5px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;font-variant-numeric:tabular-nums}
.rom .dl{align-self:start;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;
  background:var(--accent);color:#fff;font-size:12.5px;transition:.15s;white-space:nowrap}
.rom .dl:hover{background:#A5461A}
.rom .dl svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:1.8}
.md5row{grid-column:1 / -1;display:flex;align-items:center;gap:8px;margin-top:2px}
.md5row .h{font-family:var(--mono);font-size:10.5px;color:var(--ink3);word-break:break-all;flex:1;min-width:0}
.cp{border:1px solid var(--line-2);background:#fff;font-size:10.5px;color:var(--ink2);border-radius:5px;height:22px;padding:0 7px;cursor:pointer;flex:none}
.cp:hover{border-color:var(--ink2)}
.mirror{font-size:10.5px;color:var(--ink3);border-bottom:1px dotted var(--line-2);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;padding:0}
.mirror:hover{color:var(--accent)}

.note{margin:34px 0 0;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}
.note h3{font-size:12.5px;font-weight:500;color:var(--ink)}
.note p{margin:6px 0 0;font-size:12px;line-height:1.8;color:var(--ink2)}
.note a{color:var(--accent);border-bottom:1px solid rgba(192,82,29,.3)}

footer{border-top:1px solid var(--line-2);padding:26px 0 40px;font-size:12px;color:var(--ink3)}
.foot{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.foot a{color:var(--ink2)}
.foot a:hover{color:var(--ink)}
.foot .sp{margin-left:auto}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--deep);color:#fff;
  font-size:12.5px;padding:9px 15px;border-radius:8px;opacity:0;pointer-events:none;transition:.18s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}

body.detail-mode .hero,body.detail-mode .toolbar{display:none}
body.detail-mode main{padding-top:0}
body.detail-mode main{padding-top:0}
.romloading{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink3);padding:16px 2px 6px}
.romloading i{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--act);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.romloading i{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:760px){
  .wrap{padding:0 28px}
  .nav{padding:0 28px;height:62px}
  .hero{padding:62px 0 0}
  .stats{grid-template-columns:repeat(4,1fr);max-width:720px}
  .row{grid-template-columns:minmax(0,1fr) 190px 88px;gap:0 18px}
  .row .right{grid-row:auto;grid-column:auto;flex-direction:row;align-items:center;gap:16px;justify-content:flex-end}
  .row .ver{max-width:190px}
  .rom{grid-template-columns:minmax(0,1fr) auto}
  .detail{padding:38px 0 0}
}
@media (min-width:1000px){
  .listhead h2{font-size:16px}
  .row{padding:15px 4px}
}
</style>

<script>
(function () {
  'use strict';

  /* ===== 数据源：直接读开源仓库（jsDelivr 镜像，CORS 全开，缓存 12 小时） ===== */
  var SRC = {
    yaml: 'https://cdn.jsdelivr.net/gh/XiaomiFirmwareUpdater/miui-updates-tracker@master/data/latest.yml',
    rss: 'https://cdn.jsdelivr.net/gh/XiaomiFirmwareUpdater/miui-updates-tracker@master/rss/',
    snapshot: 'data/roms.json'
  };

  var PAGE_SIZE = 60;
  var STATE = { list: [], filtered: [], shown: 0, cat: 'all', sort: 'new', q: '', source: '' };

  var el = {
    q: document.getElementById('q'),
    chips: document.getElementById('chips'),
    rows: document.getElementById('rows'),
    moreWrap: document.getElementById('moreWrap'),
    moreBtn: document.getElementById('moreBtn'),
    listCount: document.getElementById('listCount'),
    listTitle: document.getElementById('listTitle'),
    countLine: document.getElementById('countLine'),
    sortBtn: document.getElementById('sortBtn'),
    sortLabel: document.getElementById('sortLabel'),
    listView: document.getElementById('listView'),
    detailView: document.getElementById('detailView'),
    loading: document.getElementById('loading'),
    loadText: document.getElementById('loadText'),
    loadBar: document.getElementById('loadBar'),
    sDevices: document.getElementById('sDevices'),
    sRoms: document.getElementById('sRoms'),
    sRec: document.getElementById('sRec'),
    sFb: document.getElementById('sFb'),
    genLine: document.getElementById('genLine'),
    toast: document.getElementById('toast'),
    brandLink: document.getElementById('brandLink')
  };

  var toastTimer = null;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 1700);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function ymd(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function toDate(v) {
    if (!v) return '';
    if (v instanceof Date && !isNaN(v.getTime())) return ymd(v);
    var s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var dt = new Date(s);
    if (!isNaN(dt.getTime())) return ymd(dt);
    return s.slice(0, 10);
  }

  var AREA = {
    'China': 1, 'Global': 1, 'India': 1, 'EEA': 1, 'Russia': 1, 'Turkey': 1, 'Taiwan': 1,
    'Indonesia': 1, 'Europe': 1, 'Japan': 1, 'Korea': 1, 'Thailand': 1, 'Vietnam': 1,
    'Malaysia': 1, 'Singapore': 1, 'Philippines': 1, 'Mexico': 1, 'Brazil': 1,
    'Latin': 1, 'America': 1, 'TW': 1, 'IN': 1, 'RU': 1, 'ID': 1, 'TR': 1, 'MI': 1
  };

  function compactName(names) {
    var norm = (names || []).map(function (n) { return String(n).replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    if (!norm.length) return '';
    if (norm.length === 1) {
      var p0 = norm[0].split(' ');
      if (p0.length >= 3 && AREA[p0[p0.length - 1]]) return p0.slice(0, -1).join(' ');
      return norm[0];
    }
    var parts = norm.map(function (n) { return n.split(' '); });
    var min = parts.reduce(function (acc, q) { return Math.min(acc, q.length); }, 99);
    var out = [];
    for (var i = 0; i < min; i++) {
      var w = parts[0][i];
      var same = true;
      for (var j = 1; j < parts.length; j++) if (parts[j][i] !== w) { same = false; break; }
      if (same) out.push(w); else break;
    }
    if (out.length >= 2) {
      while (out.length > 2 && AREA[out[out.length - 1]]) out.pop();
      return out.join(' ');
    }
    var f = norm[0].split(' ');
    if (f.length >= 3 && AREA[f[f.length - 1]]) return f.slice(0, -1).join(' ');
    return norm[0];
  }

  /* agate_global / agate_eea_global / agate_tw_global → agate */
  function baseCode(c) {
    return String(c)
      .replace(/_(eea|id|ru|tr|tw|in|jp|kr|my|sg|ph|th|vn|mx|br|latam|cn)_global$/, '')
      .replace(/_global$/, '')
      .replace(/_cn$/, '')
      .replace(/_(eea|id|ru|tr|tw|in|jp|kr|my|sg|ph|th|vn|mx|br|latam)$/, '');
  }

  function brandOf(n) {
    if (n.indexOf('Redmi') === 0) return 'Redmi';
    if (n.indexOf('POCO') === 0) return 'POCO';
    if (n.indexOf('Xiaomi') === 0) return 'Xiaomi';
    if (n.indexOf('Mi ') === 0 || n === 'Mi') return 'Mi';
    return 'Other';
  }

  function kindOf(n) { return n.indexOf('Pad') > -1 ? 'tab' : 'phone'; }

  var setProgress = (function () {
    var timer = null, fake = 0;
    return function (p, done) {
      if (done) {
        if (timer) { clearInterval(timer); timer = null; }
        el.loadBar.style.width = '100%';
        return;
      }
      if (typeof p === 'number') {
        el.loadBar.style.width = Math.max(4, Math.round(p * 100)) + '%';
      } else if (!timer) {
        timer = setInterval(function () {
          fake = Math.min(0.92, fake + 0.07);
          el.loadBar.style.width = Math.round(fake * 100) + '%';
        }, 240);
      }
    };
  })();

  function fetchText(url, timeout) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.timeout = timeout || 45000;
      xhr.onprogress = function (e) {
        if (e.lengthComputable && e.total > 0) setProgress(e.loaded / e.total);
        else setProgress(null);
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
        else reject(new Error('HTTP ' + xhr.status));
      };
      xhr.onerror = function () { reject(new Error('网络错误')); };
      xhr.ontimeout = function () { reject(new Error('超时')); };
      xhr.send();
    });
  }

  function romFromYaml(x) {
    return {
      v: String(x.version || ''),
      a: String(x.android || ''),
      dt: toDate(x.date),
      m: (x.method === 'Fastboot' ? 'Fastboot' : 'Recovery'),
      s: String(x.size || ''),
      md5: String(x.md5 || ''),
      l: String(x.link || ''),
      br: String(x.branch || '')
    };
  }

  function finalizeDevice(code, name, roms, codes) {
    var rec = 0, fb = 0, latest = '';
    roms.forEach(function (r) {
      if (r.m === 'Fastboot') fb++; else rec++;
      if (r.dt > latest) latest = r.dt;
    });
    roms.sort(function (a, b) { return a.dt < b.dt ? 1 : (a.dt > b.dt ? -1 : 0); });
    return {
      code: code, name: name, brand: brandOf(name), kind: kindOf(name),
      roms: roms, count: roms.length, rec: rec, fb: fb, date: latest,
      codes: codes || [code], regions: (codes || [code]).length,
      ver: roms.length ? roms[0].v : ''
    };
  }

  function buildFromRows(rows) {
    var groups = {}, order = [];
    rows.forEach(function (x) {
      if (!x || !x.codename) return;
      var code = String(x.codename);
      var base = baseCode(code);
      if (!groups[base]) { groups[base] = { codes: [], names: [], roms: [], seen: {} }; order.push(base); }
      var g = groups[base];
      if (!g.seen[code]) { g.seen[code] = 1; g.codes.push(code); }
      if (x.name) g.names.push(String(x.name));
      g.roms.push(romFromYaml(x));
    });
    var list = order.map(function (k) {
      var g = groups[k];
      return finalizeDevice(k, compactName(g.names) || k, g.roms, g.codes);
    });
    var seenName = {}, clash = {};
    list.forEach(function (d) { if (seenName[d.name]) clash[d.name] = 1; seenName[d.name] = 1; });
    list.forEach(function (d) {
      if (clash[d.name]) d.name = d.name + ' · ' + d.codes[0];
    });
    return list;
  }

  function buildFromSnapshot(obj) {
    var groups = {}, order = [];
    var devs = obj.devices || {};
    Object.keys(devs).forEach(function (code) {
      var d = devs[code] || {};
      var base = baseCode(code);
      if (!groups[base]) { groups[base] = { codes: [], names: [], roms: [] }; order.push(base); }
      var g = groups[base];
      g.codes.push(code);
      g.names.push(d.n || code);
      (d.r || []).forEach(function (r) {
        g.roms.push({
          v: String(r.v || ''), a: String(r.a || ''), dt: toDate(r.dt),
          m: r.m === 'Fastboot' ? 'Fastboot' : 'Recovery',
          s: String(r.s || ''), md5: String(r.md5 || ''), l: String(r.l || ''), br: String(r.br || '')
        });
      });
    });
    return order.map(function (k) {
      var g = groups[k];
      return finalizeDevice(k, compactName(g.names) || k, g.roms, g.codes);
    });
  }

  function pick(body, re) {
    var m = re.exec(body);
    if (!m) return '';
    return (m[1] || '')
      .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&#39;/g, "'").replace(/&quot;/g, '"').trim();
  }

  function unescapeHtml(s) {
    return String(s)
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
      .replace(/&amp;/g, '&');
  }

  function m1(s, re) {
    var m = re.exec(s);
    return m ? (m[1] || '').trim() : '';
  }

  function parseRss(txt) {
    var items = txt.split('<item>').slice(1);
    var out = [];
    items.forEach(function (chunk) {
      var body = chunk.split('</item>')[0];
      var title = unescapeHtml(m1(body, /<title>([\s\S]*?)<\/title>/));
      var link = m1(body, /<link>([\s\S]*?)<\/link>/);
      if (!link) return;
      var desc = unescapeHtml(m1(body, /<description>([\s\S]*?)<\/description>/));
      var verRaw = m1(desc, /<b>Version:<\/b>\s*([\s\S]*?)<\/p>/);
      var ver = verRaw, android = '';
      var bar = verRaw.indexOf('|');
      if (bar > -1) {
        ver = verRaw.slice(0, bar).trim();
        android = verRaw.slice(bar + 1).trim();
      }
      var size = m1(desc, /<b>Size:<\/b>\s*([\s\S]*?)<\/p>/);
      var md5 = m1(desc, /<b>MD5:<\/b>\s*([\s\S]*?)<\/p>/);
      var pub = m1(body, /<pubDate>([\s\S]*?)<\/pubDate>/);
      var method;
      if (/Fastboot/i.test(title)) method = 'Fastboot';
      else if (/Recovery/i.test(title)) method = 'Recovery';
      else method = /\.tgz$/.test(link) ? 'Fastboot' : 'Recovery';
      var branch = 'Stable';
      if (/Stable Beta/i.test(title)) branch = 'Stable Beta';
      else if (/Public Beta/i.test(title)) branch = 'Public Beta';
      else if (/Weekly/i.test(title)) branch = 'Weekly';
      out.push({ v: ver, a: android, dt: toDate(pub), m: method, s: size, md5: md5, l: link, br: branch });
    });
    return out;
  }

  function mergeRoms(base, extra) {
    var seen = {}, merged = [];
    base.concat(extra).forEach(function (r) {
      var key = r.l || (r.v + '|' + r.m);
      if (seen[key]) return;
      seen[key] = 1;
      merged.push(r);
    });
    merged.sort(function (a, b) { return a.dt < b.dt ? 1 : (a.dt > b.dt ? -1 : 0); });
    return merged;
  }

  var CATS = [
    { id: 'all', label: '全部' },
    { id: 'phone', label: '手机' },
    { id: 'tab', label: '平板' },
    { id: 'Xiaomi', label: 'Xiaomi' },
    { id: 'Redmi', label: 'Redmi' },
    { id: 'POCO', label: 'POCO' },
    { id: 'Mi', label: 'Mi' },
    { id: 'Other', label: '其他' }
  ];

  function inCat(d, cat) {
    if (cat === 'all') return true;
    if (cat === 'phone' || cat === 'tab') return d.kind === cat;
    return d.brand === cat;
  }

  function sortList(arr) {
    if (STATE.sort === 'new') {
      arr.sort(function (a, b) {
        if (a.date === b.date) return b.count - a.count;
        return a.date < b.date ? 1 : -1;
      });
    } else if (STATE.sort === 'name') {
      arr.sort(function (a, b) { return a.name.localeCompare(b.name, 'en'); });
    } else {
      arr.sort(function (a, b) { return b.count - a.count; });
    }
    return arr;
  }

  function renderChips() {
    var html = '';
    CATS.forEach(function (c) {
      var n = 0;
      for (var i = 0; i < STATE.list.length; i++) if (inCat(STATE.list[i], c.id)) n++;
      html += '<button class="chip' + (STATE.cat === c.id ? ' on' : '') + '" type="button" data-cat="' + c.id + '">'
        + esc(c.label) + '<span class="n">' + fmtNum(n) + '</span></button>';
    });
    el.chips.innerHTML = html;
  }

  function rowHtml(d) {
    var tags = '';
    if (d.rec) tags += '<span class="tag rec">卡刷 ' + d.rec + '</span>';
    if (d.fb) tags += '<span class="tag fb">线刷 ' + d.fb + '</span>';
    var mark = d.brand === 'Xiaomi' ? 'X' : (d.brand === 'Redmi' ? 'R' : (d.brand === 'POCO' ? 'P' : (d.brand === 'Mi' ? 'M' : '·')));
    return '<a class="row" href="#/d/' + encodeURIComponent(d.code) + '">'
      + '<span class="bm b-' + esc(d.brand.toLowerCase()) + '">' + mark + '</span>'
      + '<div class="nm">' + esc(d.name) + '</div>'
      + '<div class="co"><code>' + esc(d.code) + '</code>'
      + (d.regions > 1 ? '<span class="cnt">' + d.regions + ' 区</span>' : '') + tags + '</div>'
      + '<div class="right"><span class="ver">' + esc(d.ver || '—') + '</span><span class="dt">' + esc(d.date || '') + '</span></div>'
      + '</a>';
  }

  function catTitle() {
    if (STATE.q.trim()) return '搜索结果';
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === STATE.cat) {
      return CATS[i].id === 'all' ? '全部设备' : CATS[i].label + ' · 设备';
    }
    return '全部设备';
  }

  function applyFilter() {
    var q = STATE.q.trim().toLowerCase();
    STATE.filtered = STATE.list.filter(function (d) {
      return inCat(d, STATE.cat) && (!q || d.name.toLowerCase().indexOf(q) > -1 || d.code.toLowerCase().indexOf(q) > -1);
    });
    sortList(STATE.filtered);
    STATE.shown = 0;
    el.rows.innerHTML = '';
    el.listCount.textContent = fmtNum(STATE.filtered.length) + ' 台';
    el.listTitle.textContent = catTitle();
    if (!STATE.filtered.length) {
      el.rows.innerHTML = '<div class="empty"><b>没有匹配的设备</b>换个关键词——设备名（如 14 Ultra）或代号（如 aurora）都能搜。</div>';
      el.moreWrap.hidden = true;
      el.countLine.textContent = '0 台';
      return;
    }
    renderMore();
  }

  function renderMore() {
    var from = STATE.shown;
    var to = Math.min(from + PAGE_SIZE, STATE.filtered.length);
    var buf = [];
    for (var i = from; i < to; i++) buf.push(rowHtml(STATE.filtered[i]));
    var frag = document.createElement('div');
    frag.innerHTML = buf.join('');
    while (frag.firstChild) el.rows.appendChild(frag.firstChild);
    STATE.shown = to;
    el.moreWrap.hidden = to >= STATE.filtered.length;
    el.moreBtn.textContent = '加载更多（还有 ' + fmtNum(STATE.filtered.length - to) + ' 台）';
    el.countLine.textContent = '已显示 ' + fmtNum(to) + ' / ' + fmtNum(STATE.filtered.length) + ' 台 · 点任意一台看全部版本';
  }

  function mirrorUrl(link) {
    return String(link).replace('://bigota.d.miui.com/', '://cdnorg.d.miui.com/');
  }

  function romHtml(r) {
    var mirror = mirrorUrl(r.l);
    var hasMirror = mirror !== r.l;
    return '<div class="rom">'
      + '<div><div class="v">' + esc(r.v || '—') + '</div>'
      + '<div class="m"><span>Android ' + esc(r.a || '—') + '</span><span>' + esc(r.s || '—') + '</span>'
      + '<span>' + esc(r.dt || '') + '</span><span>' + esc(r.br || '') + '</span></div></div>'
      + '<a class="dl" href="' + esc(r.l) + '" target="_blank" rel="noopener noreferrer">'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 19h14"/></svg>下载</a>'
      + '<div class="md5row"><span class="h">MD5 ' + esc(r.md5 || '未提供') + '</span>'
      + (r.md5 ? '<button class="cp" type="button" data-cp="' + esc(r.md5) + '">复制</button>' : '')
      + (hasMirror ? '<button class="mirror" type="button" data-mirror="' + esc(mirror) + '">镜像备用</button>' : '')
      + '</div></div>';
  }

  function groupHtml(list, tagCls, title, hint) {
    if (!list.length) return '';
    var tail = tagCls === 'rec' ? 'Recovery · zip' : 'Fastboot · tgz';
    return '<div class="group"><h2><span class="tag ' + tagCls + '">' + title + '</span>' + tail + '</h2>'
      + '<p class="hint">' + hint + '</p>'
      + '<div class="roms">' + list.map(romHtml).join('') + '</div></div>';
  }

  function fillRoms(d, extra, pending) {
    var host = document.getElementById('romHost');
    if (!host) return;
    var merged = extra ? mergeRoms(d.roms, extra) : d.roms;
    var rec = merged.filter(function (r) { return r.m === 'Recovery'; });
    var fb = merged.filter(function (r) { return r.m === 'Fastboot'; });

    var html = '';
    if (pending) html += '<div class="romloading"><i></i>正在读取这台设备的完整版本记录…</div>';
    html += groupHtml(rec, 'rec', '卡刷包', '直接拷进手机，系统更新里选「选择安装包」，或进 Recovery 刷。日常升级降级优先用这个。');
    html += groupHtml(fb, 'fb', '线刷包', '解压后用 MiFlash 或 fastboot 刷，整机重写。救砖、硬降级都靠它。');
    if (!rec.length && !fb.length) {
      html += '<div class="empty"><b>这台设备暂时没有收录到包</b>可能刚发布还没出包，或者代号已经停更。</div>';
    }
    host.innerHTML = html;

    var cnt = document.getElementById('romCount');
    if (cnt) cnt.textContent = merged.length;
    var recCnt = document.getElementById('romRec');
    if (recCnt) recCnt.textContent = rec.length;
    var fbCnt = document.getElementById('romFb');
    if (fbCnt) fbCnt.textContent = fb.length;
  }

  function renderDetail(code) {
    var d = null;
    for (var i = 0; i < STATE.list.length; i++) if (STATE.list[i].code === code) { d = STATE.list[i]; break; }
    if (!d) { location.hash = '#/'; return; }

    var kindLabel = d.kind === 'tab' ? '平板' : '手机';
    var html = '<div class="detail">'
      + '<button class="back" type="button" id="backBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>返回设备列表</button>'
      + '<div class="d-head"><h1>' + esc(d.name) + '</h1>'
      + '<div class="d-meta"><code>' + esc(d.code) + '</code><span>' + esc(d.brand) + ' · ' + kindLabel + '</span></div>'
      + '<div class="d-sum"><div>包<b id="romCount">' + d.count + '</b></div><div>卡刷<b id="romRec">' + d.rec + '</b></div>'
      + '<div>线刷<b id="romFb">' + d.fb + '</b></div><div>最新<b>' + esc(d.date || '—') + '</b></div></div>'
      + '</div>'
      + '<div id="romHost"></div>'
      + '<div class="note"><h3>下载与刷写</h3>'
      + '<p>链接指向小米官方 CDN，包体原样未改。刷之前核对 MD5，和页面上一致再动手。</p>'
      + '<p>刷机有风险：跨区域、跨版本、绕过校验都可能开不了机。数据先备份，电量留够。想在本机直接刷，配合 <a href="https://hz-xb.github.io/xiao/flasher/">刷写器</a>。</p>'
      + '</div></div>';

    el.detailView.innerHTML = html;
    el.detailView.hidden = false;
    el.listView.hidden = true;

    var back = document.getElementById('backBtn');
    if (back) back.addEventListener('click', function () { location.hash = '#/'; });

    fillRoms(d, null, true);

    var codes = (d.codes && d.codes.length ? d.codes : [code]).slice(0, 8);
    Promise.all(codes.map(function (c) {
      return fetchText(SRC.rss + encodeURIComponent(c) + '.xml', 15000).catch(function () { return ''; });
    })).then(function (texts) {
      var extra = [];
      texts.forEach(function (t) { if (t) extra = extra.concat(parseRss(t)); });
      fillRoms(d, extra, false);
    }).catch(function () { fillRoms(d, null, false); });
  }

  function applyStats() {
    var total = 0, rec = 0, fb = 0;
    STATE.list.forEach(function (d) { total += d.count; rec += d.rec; fb += d.fb; });
    el.sDevices.textContent = fmtNum(STATE.list.length);
    el.sRoms.textContent = fmtNum(total);
    el.sRec.textContent = fmtNum(rec);
    el.sFb.textContent = fmtNum(fb);
  }

  function route() {
    var m = (location.hash || '#/').match(/#\/d\/(.+)$/);
    if (m) {
      document.body.classList.add('detail-mode');
      renderDetail(decodeURIComponent(m[1]));
    } else {
      document.body.classList.remove('detail-mode');
      el.detailView.hidden = true;
      el.listView.hidden = false;
    }
  }

  function boot() {
    setProgress(null);

    var p;
    if (typeof window.jsyaml === 'undefined') {
      p = Promise.reject(new Error('YAML 解析器未加载'));
    } else {
      p = fetchText(SRC.yaml, 50000).then(function (txt) {
        var rows = window.jsyaml.load(txt);
        if (!Array.isArray(rows) || !rows.length) throw new Error('数据为空');
        STATE.source = 'live';
        return buildFromRows(rows);
      });
    }

    p.catch(function () {
      STATE.source = 'snapshot';
      el.loadText.textContent = '实时源暂时连不上，改读本地快照';
      return fetchText(SRC.snapshot, 40000).then(function (txt) {
        return buildFromSnapshot(JSON.parse(txt));
      });
    }).then(function (list) {
      setProgress(1, true);
      STATE.list = list;
      applyStats();
      renderChips();
      applyFilter();
      el.loading.style.display = 'none';
      el.genLine.textContent = STATE.source === 'live'
        ? '数据实时取自 XiaomiFirmwareUpdater · 12 小时刷新'
        : '数据来自本地快照 · 实时源未连通';
      route();
    }).catch(function (err) {
      el.loadText.textContent = '数据加载失败：' + err.message;
      var bar = el.loading.querySelector('.bar');
      if (bar) bar.style.borderColor = 'transparent';
      el.rows.innerHTML = '<div class="empty"><b>没读到固件索引</b>页面需要用 HTTP 打开；两个源都被挡住时刷新再试。</div>';
    });

    el.q.addEventListener('input', function () {
      clearTimeout(el.q._t);
      el.q._t = setTimeout(function () { STATE.q = el.q.value; applyFilter(); }, 160);
    });
    el.q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { STATE.q = el.q.value; applyFilter(); }
    });
    el.chips.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-cat]');
      if (!btn) return;
      STATE.cat = btn.getAttribute('data-cat');
      renderChips();
      applyFilter();
      if (document.body.classList.contains('detail-mode')) location.hash = '#/';
    });
    el.moreBtn.addEventListener('click', renderMore);
    el.sortBtn.addEventListener('click', function () {
      STATE.sort = STATE.sort === 'new' ? 'name' : (STATE.sort === 'name' ? 'count' : 'new');
      el.sortLabel.textContent = STATE.sort === 'new' ? '最新优先' : (STATE.sort === 'name' ? '名称排序' : '包最多的');
      applyFilter();
    });
    el.detailView.addEventListener('click', function (e) {
      var cp = e.target.closest('[data-cp]');
      if (cp) {
        var v = cp.getAttribute('data-cp');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(v).then(function () { toast('MD5 已复制'); }, function () { toast('复制失败'); });
        } else toast('当前环境不支持一键复制');
        return;
      }
      var mir = e.target.closest('[data-mirror]');
      if (mir) window.open(mir.getAttribute('data-mirror'), '_blank', 'noopener');
    });
    window.addEventListener('hashchange', route);
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement !== el.q) { e.preventDefault(); el.q.focus(); }
    });
    el.brandLink.addEventListener('click', function (e) {
      e.preventDefault();
      location.hash = '#/';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
